[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# sequencer is GPL-3.0-or-later, so dependency licensing is a correctness matter rather
# than paperwork: everything here must be GPLv3-compatible. Apache-2.0 qualifies (it is
# compatible with GPLv3, though notably *not* with GPLv2).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
