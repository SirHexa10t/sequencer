[package]
name = "sequencer-input"
description = "Platform input backends for sequencer: global capture and event synthesis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# The device backend: reads /dev/input for capture, writes /dev/uinput for injection.
# The only one that reaches Wayland and the console. Inert off-Linux: target-gated below.
evdev = ["dep:evdev"]
# The X11 backend: XTEST out, passive key grabs in. Needs no device access at all, which
# is what makes an X11 run require no setup. Shares `linux::keymap`, so it pulls `evdev`
# in for the tables even though it opens no device.
xtest = ["dep:x11rb", "dep:evdev"]
# Reserved so the feature names are stable:
#   windows -- WH_KEYBOARD_LL hooks + SendInput
#   macos   -- CGEventTap + CGEventPost

[dependencies]
sequencer-core = { workspace = true }
thiserror = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["std"] }
# Sleeps natively up to the platform's accuracy, then spins out the remainder.
spin_sleep = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = { workspace = true, optional = true }
x11rb = { workspace = true, optional = true }

[lints]
workspace = true
