# sequencer binds profile — the format reference, as a working example.
# Every feature appears here at least once, with the reasoning next to it.
#
#
# binding is one [binds.<trigger>] section pressing exactly ONE of:
#
#   bind = "<key>"    A remap: each press of the trigger taps the target once — a key, or
#                     a chord spelled like any step (bind = "shift ]"). Holding the trigger
#                     repeats it (the keyboard's own auto-repeat), so PgUp held keeps
#                     stepping the volume.
#   seq  = [ ... ]    A sequence, fired once each time the trigger is pressed.
#
# and optionally, next to either:
#
#   also = [ ... ]    Extra triggers for the same action, each spelled like any trigger.
#                     Each spelling is its own bind — re-pressing the one that started a
#                     loop is what stops that loop.
#
# Injected keys pass through grabs like real presses, so one bind's output may trigger
# another (a deliberate cascade) — but a closed CIRCLE of binds feeding each other is a
# runaway machine, and is refused at load with the whole circle named. This holds across
# files too: profiles applied together must not feed each other in a loop.
#
# Case never matters, anywhere: "a" == "A", "Ctrl" == "ctrl" == "CTRL"
# PRESS / RELEASE / WAIT keywords are equally legal lowercase.
# A capitalized letter is a name, not a shifted key — to send an actual capital A, write the chord "shift a".
# The same rule for every shifted char: `{` names the `[` key and `!` names the `1` key — it's the
# same physical key, and writing it never implies shift. To send the symbol itself, chord it: "shift [".
# Within a multi-character name, `-` and `_` are interchangeable and optional: "volume-up" == "volume_up" == "volumeup".


[defaults]
tap = "8ms"      # global: duration of a 'tap', between key-down (press) and key-up (release).
                 # 8ms is also the BUILT-IN default: omit `tap` (here and per-bind) and this is the value used.
gap = "30ms"     # global: pause between consecutive steps, where no explicit WAIT says otherwise.
                 # 30ms is also the BUILT-IN default: omit `gap` and sequences still pace themselves.
suppress = true  # true (default): Bound keys are consumed, the application never sees the trigger itself, only what it was bound to.
                 # consumption is exact: only the combination you bound — an unbound variant (shift+<key> when
                 # only <key> is bound) reaches the application untouched.
program = "*"    # optional: apply only while the focused program matches (case-insensitive, `*` wildcards). "*" or absent = always apply.
                 # several alternatives are a list, applied while ANY matches: program = ["*mpv*", "*celluloid*"]
                 # run `sequencer detect-key` to print the name of programs you enter focus on. `focus: <name>`.
emergency_stop = "F8"  # optional: pressing this unapplies THIS profile gracefully — everything it still pressed is released.
                       # per-profile, not global (Ctrl+C on the manager stops every profile); may be a chord ("ctrl alt q")
                       # or a list of alternatives (["F8", "ctrl alt q"]) — any one of them stops this profile.
                       # chords fire on the EXACT combination: "ctrl alt q" does not fire on "ctrl q", nor the other way around.
                       # a bind whose trigger holds modifiers its target doesn't name fires with those modifiers
                       # LIFTED for an instant and pressed back (a held shift would otherwise recolour the target:
                       # "]" would arrive as "}"). Immediate and repeatable; the only cost is a tap-wide window in
                       # which releasing or pressing keys can misfire once.
                       # modifiers the trigger DOES hold are never re-injected: your own held ctrl supplies the
                       # target's ctrl, so "ctrl w" -> "ctrl shift w" keeps firing on every press while ctrl stays down
                       # (each tap lands as W lifts — a fresh W press cannot be synthesized while your W is still down).


# ------------------------------------------------------------------- edge mirrors

# The classic remap. Press PgUp and the volume keeps rising, exactly as if the keyboard
# had a volume key in that position.
[binds.PgUp]
bind = "volume-up"

[binds.PgDn]
bind = "volume-down"


# --------------------------------------------------------------------- sequences

# Steps come in four shapes:
#
#   "<key> [key ...]"        Tap: down, wait `tap`, up. Several names in one string are
#                            a chord — down in listed order, up in reverse.
#   "PRESS <key> [key ...]"   Press and keep down until a later RELEASE.
#   "RELEASE <key> [key ...]"
#   "WAIT <duration>"        Pause here, REPLACING the default gap at this seam only.
#
# A WAIT duration is <num><unit>, unit one of ms / s / m / h, decimals allowed:
# "WAIT 200ms", "WAIT 1.5s", "WAIT 2m", "WAIT 1h".
# Zero alone may drop the unit ("0ms" == "0h"), and only zero — "WAIT 5" is an error.
# That makes "WAIT 0" the idiom for NO pause at one seam, and `gap = "0"` for none
# anywhere in a bind; the rule presses wherever a duration appears, `tap` included.

# A combo, with per-bind timing overrides.
[binds.F2]
tap = "50ms"    # when game polls slowly, linger for the key to register
gap = "100ms"
seq = [
    # CounterStrike 1.6 buy Kevlar+helmet  (comments like these are allowed)
    "b",    # plain tap lasts the specified amount of time
    "8",    # tapped after a pause 
    "2",
    # buy defuse-kit(CT)
    "b",
    "8",
    "6",
]


# A combo, with chords and varying waiting time
[binds.F6]
gap = "50ms"
seq = [
    "shift",           # a plain tap
    "PRESS ctrl",      # ctrl stays down across the next steps
    "space d",         # a chord: space and d together
    "WAIT 200ms",      # explicit pause - OVERWRITES the 50ms gap here
    "w p",
    "RELEASE ctrl",
]

# `loop` repeats the sequence per press: a count, or "inf" until stopped. Pressing the
# trigger again stops it early, releasing anything the sequence still pressed.
# RNG opens a chance block and GNR closes it (its `fi`): the block runs with the given
# chance, spelled 0.25, 25% or 1/4 alike. LOOP opens a repeat block and POOL closes it:
# "LOOP 3" runs the enclosed steps three times. The two block kinds nest freely but
# close inside each other, and what a LOOP iteration PRESSes it must RELEASE before
# its POOL — a leaked hold would stack up an extra press every pass.
[binds.F7]
loop = "inf"
seq = [
    "e",
    "RNG 25%",         # chance: a quarter of iterations do the following
        "WAIT 300ms",
    "GNR",             # Shell-styled block; end of last "RNG" command (you can nest)
    "LOOP 2",          # repeat the enclosed steps twice
        "q",
        "WAIT 100ms",
    "POOL",            # end of (last) LOOP
    "WAIT 1s",
]

# A trigger can be a chord too, spelled exactly like a step: modifiers plus ONE ordinary
# key, which is the shape a key grab can express. TOML wants quotes around a section key
# containing a space. A bare key and chords over it may all be triggers — `i`, `ctrl i`
# and `alt i` are three distinct grabs; each press routes by its exact modifier state,
# and a variant nothing binds passes through to the application.
# Left/right spellings of one combo may coexist ("shift >" and "rshift >"): they share one
# grab, and each press routes to the side you are physically holding. A lone spelling
# catches both sides.
[binds."ctrl i"]
also = ["alt i"]   # extra spellings of the trigger; fine here because their grabs differ
seq = [
    "Ctrl d",
    "Enter",
    "Ctrl w",
]

# Problematic use-case; user presses a modifier-key (shift), and asks for an emit without it
# In this example, the "]" would transform into "shift ]" (i.e.: '}') due to the user pressing shift
# The solution: your shift is lifted for the tap's instant and pressed straight back (the
#  xdotool --clearmodifiers mechanism). Immediate and repeatable; the tradeoff is that such a
#  bind can only be a 'tap' — no accurate "holding" of output is possible.
[binds."rshift >"]
bind = "]"          # taps (only; no holding) as a plain "]" even while your shift stays down (lifted around the tap)

# --------------------------------------------------------------------- key names
#
# For the full list of valid key names — the keyboard plus the media, mouse, wheel and
# controller sets — run: `sequencer detect-key`. It draws the layout, lists every set,
# and prints the name of any key you press.
#
# To check a file without applying it (and optionally tidy it in place, comments kept):
#   sequencer profile-check my-binds.toml
#   sequencer profile-check --format my-binds.toml
