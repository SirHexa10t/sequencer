[package]
name = "sequencer-cli"
description = "Autoclicker and hotkey-binding-profile interpreter: library and `sequencer` binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["cli", "logging", "evdev", "xtest"]
# The clap surface: Cli, Command, the *Args types, and run/try_run. Turn it off to embed
# just the engine wiring with no clap in your dependency graph.
# `nix` rides along for detect-key's terminal raw mode (termios); serde+toml parse
# apply-profile's binds files.
cli = ["dep:clap", "dep:nix", "dep:serde", "dep:toml"]
# init_logging(). Off for embedders that own the global tracing subscriber themselves.
logging = ["dep:tracing-subscriber"]
# The Linux input backend. On by default so `cargo build` produces a working clicker;
# inert on other platforms. `nix` rides along for session mode's privilege drop.
evdev = ["sequencer-input/evdev", "dep:nix"]
# The X11 backend. On by default: on an X11 session it makes the whole run need no device
# access and so no password, which is the difference between a tool you set up and one you
# just run.
xtest = ["sequencer-input/xtest"]

[dependencies]
sequencer-core = { workspace = true }
sequencer-input = { workspace = true }
thiserror = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["std", "attributes"] }
clap = { workspace = true, optional = true, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
    "suggestions",
    "color",
    "wrap_help",
] }
tracing-subscriber = { workspace = true, optional = true, features = ["fmt", "ansi"] }
serde = { workspace = true, optional = true, features = ["derive"] }
toml = { workspace = true, optional = true, features = ["parse"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, optional = true, features = ["user", "term"] }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
trycmd = { workspace = true }

[[bin]]
name = "sequencer"
path = "src/bin/sequencer.rs"
required-features = ["cli"]

[lints]
workspace = true
