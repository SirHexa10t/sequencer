# sequencer binds profile — the format reference; every feature appears once.

#### SYNTAX / SAFEGUARDS ####
# * Cascades (one bind's output triggering another) are ALLOWED
#   * a closed CIRCLE of binds feeding each other is REFUSED at load, across files too.
# * Char-case doesn't matter; "a" == "A", "Ctrl" == "CTRL" == "ctrl"
#   * Spacers ('-', '_', '') are interchangeable; "volume-up" == "volume_up" == "volumeup"
# * Inputs are considered by keys; "{" == "[", "!" == "1"
#   * To output a literal "!", the syntax is "shift 1" (same as "shift !")
# * Command-names (below) are LEGAL in lower-case


#### HELPERS ####

# `sequencer detect-key`            # names every key, detects key-input and prints its name, detects and prints focused-program's name.
# `sequencer profile-check <FILE>`  # Validity-check for your `.toml` profile-file.
#   `sequencer profile-check --format <FILE>`  # Checks AND tidies-up your file


#### FIELDS ####

[defaults]
tap = "8ms"      # (default) optional overwrite: how long a tap holds the key down
gap = "30ms"     # (default) optional overwrite: the pause between steps, unless an explicit WAIT is specified;
suppress = true  # (default) optional overwrite: bind-activation consumes input-keys 
                 #   (on exact modifier-keys ; binding "<key>" means "shift <key>" presses pass through)
program = "*"    # optional: profile applies only while the focused program matches (otherwise: global/whole-system)
                 #   `*`: program-name wildcard  ;  `["*mpv*", "*celluloid*"]`: a list of program-names to apply-on
                 #   A profile that activates on a focused program ECLIPSES global profiles' binds, when the binds (inputs) are the same
                 #   Run `sequencer detect-key` and focus (click on) your targeted program(s), to discover their name.
emergency_stop = "F8"  # optional <key/chord>: gracefully unapplies THIS profile, releasing all of its own binds.
                       #   To stop all profiles: SIGTERM (Ctrl+C) on the manager's process.
                       #   Supports alternatives' list, like `program` field. Chords fire on the EXACT combination.


#### BIND-FIELDS ####

#   bind = "<key or chord>"   remap: register alternative tap/press in your system
#                               limited to 'tap' only, in some problematic use-case ("edge-cases" below)
#   also = [ ... ]            (optional) extra bind-alias, making more than 1 bind act the same
#   seq  = [ ... ]            sequence of steps (commands below), runs when bind is triggered
#                               (re-pressing the spelling that started a sequence stops it).
#   loop = <n> / "inf"        (optional, seq only) repeats the whole sequence
#                               re-triggering the bind stops it early and releases its held-down keys
#   tap  = "<duration>"       (optional) per-bind override of the [defaults] timings
#   gap  = "<duration>"       (optional) per-bind override of the [defaults] timings


#### SEQUENCE-COMMANDS ####

#   "<key> [key ...]"         tap key/chord: key is pressed, held for `tap`-long wait, released. 
#                             (pressed in listed order, released in reverse)
#   PRESS <key> [key ...]     hold key/chord down across the following steps, until `RELEASE` (or bind termination)
#   RELEASE <key> [key ...]   let go of `PRESS`'d key
#   WAIT <duration>           pause, replacing the `gap` waiting period between prior and next commands
#                               <duration>s are: <num><unit>, units: ms/s/m/h, decimals fine ("WAIT 1.5s")
#                               only zero may drop the unit: "WAIT 0" = no pause (practically `gap`-erasure)
#   RNG <chance>              the enclosed steps run by chance: 0.25 == 25% == 1/4
#   GNR                       close the script-block of last `RNG`
#   LOOP <n>                  the enclosed steps repeat n times
#   POOL                      close the script-block of last `LOOP`
#
# * Blocks (of `RNG`/`LOOP`) may nest
#   * ILLEGAL closures (ending external block before nested block) are checked, and prevented from running


#### EXAMPLES ####

# ================================= edge mirrors =================================

# The classic remap: PgUp becomes a volume key, auto-repeat included.
[binds.PgUp]
bind = "volume-up"

[binds.PgDn]
bind = "volume-down"


# ================================= plain sequence =================================

# A combo, with per-bind timing overrides.
[binds.F2]
tap = "50ms"    # when a game polls slowly, linger for the key to register
gap = "100ms"
seq = [
    # CounterStrike 1.6 buy Kevlar+helmet  (comments like these are allowed in-script)
    "b",    # plain tap, that lasts `tap` time
    "8",
    "2",
    # buy defuse-kit(CT)
    "b",
    "8",
    "6",
]


# ================================= tricky sequence =================================

# A combo with chords, a held modifier and a custom pause.
[binds.F6]
gap = "50ms"
seq = [
    "shift",           # a plain tap
    "PRESS ctrl",      # ctrl stays down across the next steps
    "space d",         # a chord: space and d together
    "WAIT 200ms",      # explicit pause - REPLACES this spot's specific 50ms gap
    "w p",
    "RELEASE ctrl",
]


# ================================= perpetual sequence =================================

# An endless farm: chance and repeat blocks inside an "inf" sequence.
[binds.F7]
loop = "inf"
seq = [
    "e",
    "RNG 25%",         # a quarter of iterations do this
        "WAIT 300ms",
    "GNR",
    "LOOP 2",          # repeat the enclosed steps twice
        "q",
        "WAIT 100ms",
    "POOL",
    "WAIT 1s",
]


# ================================= chord/multi-input =================================

# Chord trigger: modifiers + ONE ordinary key.
# Modifiers matter: `i`, `ctrl i` and `alt i` all coexist as different binds, not triggering together
[binds."ctrl i"]
also = ["alt i"]   # an extra alias of this bind-trigger (either this or the main trigger needed to fire)
seq = [
    "Ctrl d",
    "Enter",
    "Ctrl w",
]


# ================================= edge-cases =================================

# The shift you hold would recolour "]" into "}", so:
# Shift is released when bind is triggered, then pressed again after bind fires.
# Instant and repeatable, but locks this kind of bind into `tap`s (no held-output).
[binds."rshift >"]
bind = "]"


# Left/right spellings ("shift >" vs "rshift >") coexist - program uses ONE grab for both
# REMOVING (or commenting this out) would make the previous bind the owner of both `shift`s, triggering it on either
[binds."shift >"]
bind = "shift }"


