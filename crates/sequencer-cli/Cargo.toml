[package]
name = "sequencer-cli"
description = "Hotkey-binding-profile interpreter: library and `sequencer` binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["cli", "logging", "evdev", "xtest"]
# The clap surface: Cli, Command, the *Args types, and run/try_run. Turn it off to embed
# just the run plumbing (the event pumps and `Deps`) with no clap in your dependency
# graph.
# `nix` rides along for detect-key's terminal raw mode (termios); serde+toml parse
# apply-profile's binds files.
cli = ["dep:clap", "dep:nix", "dep:serde", "dep:toml", "dep:toml_edit", "dep:signal-hook"]
# init_logging(): the stderr logger behind -q/-v/-vv. Off for embedders that install
# their own `log` logger. It pulls in no dependency, only the printer's own code.
logging = []
# The Linux device backend: detect-key's exact mode, bench, and the devices profiles run
# on first (with `xtest`). On by default; inert on other platforms. `nix` rides along for
# session mode's privilege drop.
evdev = ["sequencer-input/evdev", "dep:nix"]
# The X11 backend, which the profile manager is built on and falls back to where the
# devices can't be opened. On by default: it needs no device access and so no password,
# which is the difference between a tool you set up and one you just run.
xtest = ["sequencer-input/xtest"]
# The live suite's device tiers: `sequencer-live-rig`, the helper that types on a test
# keyboard of its own and reads back what sequencer's virtual keyboard sends. Test
# machinery, never shipped: SUDO-TEST.sh turns it on for the live pass.
live-tests = ["evdev", "sequencer-input/live-tests"]

[dependencies]
sequencer-core = { workspace = true }
sequencer-input = { workspace = true }
thiserror = { workspace = true, features = ["std"] }
log = { workspace = true }
clap = { workspace = true, optional = true, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
    "suggestions",
    "color",
    "wrap_help",
] }
# `std` is declared, not inherited: the derived untagged enums need serde's `alloc`
# half, and nothing else switches it on — `toml` and `toml_edit` depend on `serde_core`,
# not on `serde`. (`toml` 0.8 used to turn it on from the side; the upgrade proved it.)
serde = { workspace = true, optional = true, features = ["derive", "std"] }
toml = { workspace = true, optional = true, features = ["parse", "serde"] }
toml_edit = { workspace = true, optional = true, features = ["parse", "display"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Only the feature-free surface is used: `flag` for the interrupt latch, `low_level`
# for dying by the caught signal.
signal-hook = { workspace = true, optional = true }
# `fs` is for `flock`: the manager lock is an advisory lock the kernel releases when
# the process dies, however it dies — the only liveness test a PID cannot fake.
nix = { workspace = true, optional = true, features = [
    "user",
    "term",
    "poll",
    "signal",
    "process",
    "fs",
] }

[dev-dependencies]
# The live suite sends real SIGINT to the manager it spawns, and checks that a quit
# manager's advisory lock is free (`fs`).
nix = { workspace = true, features = ["signal", "fs"] }

[[bin]]
name = "sequencer"
path = "src/bin/sequencer.rs"
required-features = ["cli"]

# The live suite's root helper for the device tiers (`tests/live/rig.rs` drives it).
[[bin]]
name = "sequencer-live-rig"
path = "src/bin/live_rig.rs"
required-features = ["live-tests"]

# The live suite drives the real binary (CARGO_BIN_EXE), so it needs the same gate.
[[test]]
name = "live"
path = "tests/live/main.rs"
required-features = ["cli"]

[lints]
workspace = true
