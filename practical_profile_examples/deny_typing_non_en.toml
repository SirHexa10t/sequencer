# Refuse to type while the keyboard is on a non-English layout, in the named programs.
#
# `kb_lang` matches the LAYOUT NAME your system uses — run `sequencer detect-key` and
# switch language: it prints `lang: us`, `lang: il`, ... Those are the spellings to write
# here ("English" is not one of them). `!` inverts, so `!us*` is "every layout except us".
#
# Each bind swallows one key: the grab consumes the press and `NOP` emits nothing, so the
# key does nothing while BOTH gates match; and behaves completely normally otherwise.

# This is a hacky profile; nothing's wrong with that. It shows the versatility of our tool.

[defaults]
emergency_stop = "ctrl shift e"
program = ["*librewolf*", "*vivaldi*"]
kb_lang = "!us*"   # every layout except us / us-intl / us(dvorak)...

[binds.q]
bind = "NOP"

[binds.w]
bind = "NOP"

[binds.e]
bind = "NOP"

[binds.r]
bind = "NOP"

[binds.t]
bind = "NOP"

