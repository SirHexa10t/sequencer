[workspace]
resolver = "3"
members = ["crates/*"]
# So a bare `cargo build` / `cargo run` at the root does the obvious thing. Note this
# also narrows a bare `cargo test` to the CLI crate, so use `cargo test --workspace`.
default-members = ["crates/sequencer-cli"]

[workspace.package]
# 0.x: X11 is done properly, and Wayland through the input devices (checked live on KDE
# Plasma); the other display stacks — Windows, macOS — are the road to 1.0.
version = "0.8.0"
edition = "2024"
# Let-chains (`if ... && let ...`) are used, and those need 1.88.
rust-version = "1.88"
license = "GPL-3.0-or-later"
# No `authors`: git history already records who wrote what, and duplicating it here only
# creates a second copy to go stale. No crates.io metadata either -- this is consumed as
# a git dependency, and `sequencer` is already taken on the registry.
repository = "https://github.com/SirHexa10t/sequencer"

[workspace.dependencies]
sequencer-core = { version = "0.8.0", path = "crates/sequencer-core" }
sequencer-input = { version = "0.8.0", path = "crates/sequencer-input", default-features = false }

thiserror = { version = "2", default-features = false }
clap = { version = "4", default-features = false }
# The logging facade every crate writes through; `sequencer-cli`'s `logging` module is
# the one printer. Chosen over tracing + tracing-subscriber (2026-09-30): nothing here
# opens a span or reads a logged value back, and `log` has no dependencies where those
# two brought nine crates between them.
log = { version = "0.4", default-features = false }
spin_sleep = "1.3"
# TODO: back to a crates.io release (`evdev = "0.13.x"`) once one carries the fix this
# commit pins — and drop its `allow-git` entry in deny.toml with it. evdev 0.13.2, the
# latest release as of 2026-11-04, encodes the `UI_SET_PHYS` ioctl with a one-byte
# argument where the kernel's request carries a pointer, so the kernel refuses it
# ("Invalid argument") and no mouse's stand-in can be made: its `phys` is how sequencer
# and the stand-in udev rule know it (found live, 2026-11-04). This commit is 0.13.2 plus
# that one fix (upstream PR #163, `src/sys.rs` alone; nix still 0.29), merged 2025-10-10
# and in no release since. Pinned by rev, never a branch, so the build can't move under us;
# the version beside it is cargo-deny's (a git dependency without one counts as a
# wildcard), and leaves only `git` and `rev` to delete when a release comes.
evdev = { version = "0.13.2", git = "https://github.com/emberian/evdev", rev = "5055f650b3a8c4ef45fd548e58bc080009462f2d" }
# X11 XTEST injection and key grabs — pure Rust, no libX11.
# `xtest` injects, `xkb` reads which keyboard layout (group) is active.
x11rb = { version = "0.14", default-features = false, features = ["xtest", "xkb"] }
# Binds profiles are TOML; serde only ever derives Deserialize here.
serde = { version = "1", default-features = false }
toml = { version = "1.1", default-features = false }
# Format-preserving TOML for `profile-check --format`: rewrites layout while keeping
# every comment the user wrote. `toml`'s own parser stays for reading. Neither replaces
# the other: `toml` exposes no document model, and since 1.0 it no longer builds on
# `toml_edit` at all — the two share only the `toml_parser` layer underneath.
toml_edit = { version = "0.25", default-features = false }
# Ctrl+C must run teardown rather than kill the process mid-injection: a signal that
# skips the release ledger leaves a key pressed on the user's real keyboard. Registering
# a handler is `unsafe` in std/nix; signal-hook's flag API is the safe wrapper.
signal-hook = { version = "0.4", default-features = false }
# Privilege drop for session mode (setgroups/setgid/setuid), termios, poll, flock.
# Pinned to 0.29, behind the latest (0.31), on purpose: evdev 0.13, itself the newest
# evdev, depends on nix 0.29, so matching it keeps one copy of nix in the tree instead
# of two. Nothing this code calls changed between the two (checked 2026-09-30 against
# both changelogs and a full test run on each). Move it when evdev moves.
nix = { version = "0.29", default-features = false }
# Handing grabbed devices to the supervisor process: SCM_RIGHTS over a socket. nix 0.29
# returns received descriptors as raw numbers, and owning one is `unsafe`; rustix returns
# `OwnedFd`s, so the workspace stays free of unsafe code. Already in the tree through
# x11rb (2026-11-03), so this adds no package — only its `net` module to the build.
# `event` is there because `net`'s socket options use rustix's time conversions and,
# in 1.1.5, don't turn them on themselves; x11rb enables `event` anyway.
rustix = { version = "1.1", default-features = false, features = ["std", "net", "event"] }


[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Opt-outs from pedantic that fight the house style rather than helping it.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
# Wants backticks around every proper noun that looks like an identifier -- AutoHotkey,
# XInput2, HiDPI, EVIOCGRAB. Backticking prose makes it harder to read, not easier.
doc_markdown = "allow"
# A capability struct is a list of named yes/no answers. Bundling them into an enum or a
# bitflags type to satisfy a count would make every call site worse.
struct_excessive_bools = "allow"
# `unwrap_used` stays at `warn` here and is switched off per-crate under `cfg(test)`:
# tests say `unwrap()` where library code says `?`, and a test that unwraps is reporting
# a failure rather than hiding one.
# Library-safety rules from the plan, as lints rather than as review comments.
exit = "deny"
dbg_macro = "deny"
unwrap_used = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
# panic = "abort" would skip Drop, which skips the runner's release_all(), which hands
# the user a stuck modifier key. Unwinding is load-bearing here, not a default we forgot
# to override.
panic = "unwind"

